# 512m (the Gradle default) is not enough for AGP 8's Kotlin + dexing steps and fails on CI as an
# opaque "Daemon disappeared" rather than an out-of-memory error.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# This library depends on no AndroidX artifact at all (CONTRACT rule 5). The flag is set anyway
# because every consuming app is an AndroidX app, and a composite build of this module inside one
# of them fails outright when the flag is absent.
android.useAndroidX=true

kotlin.code.style=official
